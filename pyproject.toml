[project]
name = "erpnext_shipping"
authors = [
    { name = "Frappe Technologies Pvt Ltd and contributors", email = "developers@frappe.io"}
]
description = "Shipping Integrations for ERPNext"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true
